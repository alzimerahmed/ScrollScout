buildscript {
    apply from: 'global.gradle'
    dependencies {
        // AGP 7.4.2's bundled D8 cannot dex kotlin-stdlib 1.9.x metadata; force newer R8
        classpath 'com.android.tools:r8:8.3.37'
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.hilt) apply false
    alias(libs.plugins.detekt) apply false
    alias(libs.plugins.ktlint) apply false
}

apply from: 'global.gradle'

// Static analysis: detekt + ktlint across all modules (Phase 4).
// Baselines keep legacy violations non-blocking; new code must stay clean.
allprojects {
    apply plugin: 'org.jlleitschuh.gradle.ktlint'
    ktlint {
        version = "0.50.0"
        android = false
        ignoreFailures = false
        // Per-module baseline at <module>/config/ktlint/baseline.xml (plugin default).
        // Regenerate with: cd <module> && ktlint --baseline=config/ktlint/baseline.xml "src/**/*.kt"
        filter {
            exclude { element -> element.file.path.contains("build/") }
        }
    }
}

subprojects {
    apply plugin: 'io.gitlab.arturbosch.detekt'
    detekt {
        toolVersion = libs.versions.detekt.get()
        config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
        baseline = file("$rootDir/config/detekt/baseline.xml")
        buildUponDefaultConfig = true
        parallel = true
    }
}
