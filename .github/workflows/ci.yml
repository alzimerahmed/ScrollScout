name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Write local.properties from secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "API_ID=${API_ID}"
            echo "API_HASH=${API_HASH}"
          } > local.properties

      - name: Static analysis (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --stacktrace

      - name: Build + unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/androidTests/

  # Release builds run R8/proguard, which can fail where debug passes —
  # verify assembleRelease (unsigned is fine for PR verification) per PR.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Write local.properties from secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "API_ID=${API_ID}"
            echo "API_HASH=${API_HASH}"
          } > local.properties

      - name: Assemble release (R8 minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
